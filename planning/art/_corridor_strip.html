  <div class="cap">
    <b>净空：</b>门架梁底 5.5 m、管廊底 5.2 m，均高于角色 1.6 m；<span class="warn">岗亭、隔离墩、货堆不进入通道段中线两侧各 3 m 的冲刺带</span>；道闸立柱在带外，横杆抬起。
    <b>动线：</b>花园南门 → 导视门架（双面箭头）→ 检查站（岗亭/道闸）→ 管廊 → 隔离墩 → 北门 → 场内 195 m → 丢包撤离点；地面绿线到北门前拐向东侧 4 m 缝。通道 30 m 不变，丢包赛跑不用绕障碍。
  </div>
