<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>291_aglina Spine runtime capture</title>
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="/vendor/pixi.js"></script>
  <script src="/vendor/pixi-spine.js"></script>
  <script>
    const LOCKED_SKELETON_SHA = 'efc45340936ec4ef3da37e351975c2902b6d5d9f8f46684ebbd7dc7b93683eee';
    const params = new URLSearchParams(location.search);
    const SIZE = Number(params.get('size') || 1024);
    const animArg = params.get('anim') || '';
    const timeArg = Number(params.get('time') || 0);
    const skinArg = params.get('skin') || '';
    const mode = params.get('mode') || (animArg ? 'frame' : 'inventory');

    const app = new PIXI.Application({
      width: SIZE,
      height: SIZE,
      backgroundAlpha: 1,
      backgroundColor: 0xff00ff,
      antialias: true,
      preserveDrawingBuffer: true,
      powerPreference: 'high-performance'
    });
    document.body.appendChild(app.view);
    window.__app = app;
    const bg = new PIXI.Graphics();
    bg.beginFill(0xff00ff);
    bg.drawRect(0, 0, SIZE, SIZE);
    bg.endFill();
    app.stage.addChild(bg);

    const logs = [];
    function log(...args) {
      const line = args.map(a => typeof a === 'string' ? a : JSON.stringify(a)).join(' ');
      logs.push(line);
      console.log(line);
    }
    function post(payload) {
      return fetch('/result', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    }
    function captureImages() {
      app.renderer.render(app.stage);
      const view = app.view.toDataURL('image/png');
      const extractCanvas = app.renderer.extract.canvas(app.stage, new PIXI.Rectangle(0, 0, SIZE, SIZE), 1);
      const extract = extractCanvas.toDataURL('image/png');
      return { view, extract };
    }
    function fitSpine(spine) {
      spine.skeleton.updateWorldTransform();
      const b = spine.getLocalBounds();
      const pad = 36;
      const scale = Math.min((SIZE - pad * 2) / Math.max(1, b.width), (SIZE - pad * 2) / Math.max(1, b.height));
      spine.scale.set(scale);
      spine.x = SIZE / 2 - (b.x + b.width / 2) * scale;
      spine.y = SIZE / 2 - (b.y + b.height / 2) * scale;
      spine.skeleton.updateWorldTransform();
      return { localBounds: { x: b.x, y: b.y, width: b.width, height: b.height }, scale };
    }
    function applyPose(spine, animName, time) {
      spine.autoUpdate = false;
      const anim = spine.spineData.animations.find(a => a.name === animName);
      if (!anim) throw new Error('animation not found: ' + animName);
      spine.state.clearTracks();
      spine.state.setAnimation(0, animName, true);
      spine.state.update(time);
      spine.update(0);
      return { name: anim.name, duration: anim.duration, time };
    }

    try {
      if (PIXI.spine.SpineParser && PIXI.spine.SpineParser.registerLoaderPlugin) {
        PIXI.spine.SpineParser.registerLoaderPlugin();
      }
      log('PIXI', PIXI.VERSION, 'pixi-spine', (PIXI.spine && PIXI.spine.VERSION) || '3.0.16');
      const loader = new PIXI.Loader();
      loader.add('aglina', '/ref/build_char_291_aglina.skel');
      loader.onError.add(err => log('LOADER_ERROR', String(err)));
      loader.load(async (loader, resources) => {
        try {
          const resource = resources.aglina;
          const data = resource.spineData;
          if (!data) throw new Error('spineData missing; atlas/loader failed');
          const skins = (data.skins || []).map(s => s.name);
          const animations = (data.animations || []).map(a => ({ name: a.name, duration: a.duration }));
          const inventory = {
            source_skeleton_sha256: LOCKED_SKELETON_SHA,
            source_files: {
              skeleton: 'reference/character_sources/ark_models/291_aglina/build_char_291_aglina.skel',
              atlas: 'reference/character_sources/ark_models/291_aglina/build_char_291_aglina.atlas',
              texture: 'reference/character_sources/ark_models/291_aglina/build_char_291_aglina.png'
            },
            runtime: { name: 'pixi-spine (Spine 3.8 runtime)', version: '3.0.16', host: 'Chromium headless WebGL' },
            extraction_method: 'runtime_parse',
            skeleton_version: data.version,
            width: data.width,
            height: data.height,
            fps: data.fps,
            skins,
            animations,
            bones: (data.bones || []).map(b => b.name),
            slots: (data.slots || []).map(s => s.name),
            mapping: { idle: null, move: null }
          };
          log('skins:', skins);
          log('animations:', animations);
          log('skeleton:', data.version, data.width + 'x' + data.height);
          const chosenSkin = skinArg || skins[0] || null;
          const spine = new PIXI.spine.Spine(data);
          if (chosenSkin) {
            spine.skeleton.setSkinByName(chosenSkin);
            spine.skeleton.setSlotsToSetupPose();
            log('skin chosen:', chosenSkin);
          }
          app.stage.addChild(spine);
          window.__spine = spine;
          window.__inventory = inventory;
          window.__render = (anim, time) => {
            app.ticker.stop();
            spine.autoUpdate = false;
            const pose = applyPose(spine, anim, time);
            const fit = fitSpine(spine);
            const cap = captureImages();
            const eyes = spine.skeleton.slots
              .filter(s => /Eye|Mouth/.test(s.data.name))
              .map(s => ({ slot: s.data.name, attachment: s.getAttachment() ? s.getAttachment().name : null }));
            return { pose, fit, extract: cap.extract, eyes };
          };
          window.__ready = true;
          window.__setFixedCamera = () => {
            spine.state.clearTracks();
            spine.skeleton.setToSetupPose();
            spine.update(0);
            const b = spine.getLocalBounds();
            const pad = 48;
            const scale = Math.min((SIZE - pad * 2) / Math.max(1, b.width), (SIZE - pad * 2) / Math.max(1, b.height)) * 0.94;
            const x = SIZE / 2 - (b.x + b.width / 2) * scale;
            const y = SIZE / 2 - (b.y + b.height / 2) * scale;
            window.__camera = { scale, x, y, setupBounds: { x: b.x, y: b.y, width: b.width, height: b.height } };
            spine.scale.set(scale);
            spine.position.set(x, y);
            spine.update(0);
            return window.__camera;
          };
          window.__renderFixed = (anim, time) => {
            applyPose(spine, anim, time);
            const cam = window.__camera;
            spine.scale.set(cam.scale);
            spine.position.set(cam.x, cam.y);
            spine.update(0);
            const cap = captureImages();
            const root = spine.skeleton.bones.find(b => b.data.name === 'root');
            return {
              pose: { name: anim, time },
              camera: cam,
              root: root ? { x: root.x, y: root.y, worldX: root.worldX, worldY: root.worldY } : null,
              extract: cap.extract
            };
          };

          await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
          app.ticker.stop();
          spine.autoUpdate = false;
          let images = [];
          let pose = null;
          if (mode === 'inventory') {
            spine.update(0);
            fitSpine(spine);
            const cap = captureImages();
            images = [{ name: 'setup_view', data: cap.view }, { name: 'setup_extract', data: cap.extract }];
            log('rendered setup pose', JSON.stringify(fitSpine(spine)));
          } else {
            pose = applyPose(spine, animArg, timeArg);
            const fit = fitSpine(spine);
            const cap = captureImages();
            const base = 'anim_' + animArg + '_' + String(timeArg).replace('.', 'p');
            images = [{ name: base + '_view', data: cap.view }, { name: base + '_extract', data: cap.extract }];
            log('rendered', JSON.stringify({ ...pose, ...fit }));
          }
          log('capture lengths', images.map(x => x.name + ':' + x.data.length).join(','));
          await post({ inventory, images, log: logs.join('\n') + '\n' });
          document.title = 'DONE';
        } catch (err) {
          log('ERROR', String(err && err.stack || err));
          await post({ log: logs.join('\n') + '\n' });
          document.title = 'ERROR';
        }
      });
    } catch (err) {
      log('FATAL', String(err && err.stack || err));
      post({ log: logs.join('\n') + '\n' });
    }
  </script>
</body>
</html>
